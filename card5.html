<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/card5.css">
</head>
<body>
    <div class="card">
        <img src="/Image/Company.png" alt="">
        <div class="text_content">
            <h1>Your Company</h1>
            <p>Tell us about your company. You will be able to invite your teammates in the next step.</p>
        </div>

        <div class="inputs">
            <label for="#">Company name</label>
            <input type="text" name="Company Name" id="#" placeholder="Company name" class="area">

            <div class="select_industry selecting">
                <label for="Industry">Industry (Optional)</label>
                <img src="Image/Dropdown.svg" alt="arrow" srcset="" class="dropdown">
                <img src="/Image/Creative.png" alt="Creative" class="option_icons">
                <select name="Industry" id="#" class="select">
                    <option value="Creative Agency">
                        Creative Agency
                    </option>
                </select>
            </div>


            <div class="select_industry selecting">
                <label for="Role">Your role (Optional)</label>
                <img src="Image/Dropdown.svg" alt="arrow" srcset="" class="dropdown">
                <img src="/Image/Owner.png" alt="Role" class="option_icons">
                <select name="Role" id="#" class="select">
                    <option value="Creative Agency">
                        Owner/Founder/CEO
                    </option>
                </select>
            </div>


            <div class="select_industry selecting">
                <label for="Size">Company-size (Optional)</label>
                <img src="Image/Dropdown.svg" alt="arrow" srcset="" class="dropdown">
                <select name="Size" id="#" class="area">
                    <option value="Creative Agency">
                        2-10
                    </option>
                </select>
            </div>

        </div>
    
         <button class="card-btn">Continue</button>
    </div>
</body>
</html>
