<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/CSS/card3.css">
</head>
<body>
      <div class="card">
        <img src="/Image/Phone.png" alt="hand wave">
        <div class="text_content">
            <h1>Phone Number</h1>
            <p>Would you like a new OpenPhone Number, or want to port your existing number over?</p>
        </div>
        <button class="Work-btn">
            <p><img src="/Image/Gift.png" alt="briefcase" srcset=""><Span>Work</Span>
            <img src="/Image/arrow.svg" alt="arrow" srcset="" class="arrow"></p>
        </button> 
        <button class="Personal-btn">
            <p><img src="/Image/direction.png" alt="house" srcset=""><Span>Personal</Span></p>
        </button>

            <p class="para_content"> If you choose to port your existing number, you will be given a temporary OpenPhone number to test things out with during the porting process.</p>
    
    </div>
</body>
</html>
